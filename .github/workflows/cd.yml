name: CD

# CD:
#   1) собирает Docker-образ и публикует его в GitHub Container Registry (GHCR);
#   2) деплоит на сервер по SSH (включается переменной репозитория DEPLOY_ENABLED=true).
on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "## Образ опубликован"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build_push
    # Деплой запускается только если в настройках репозитория задана
    # переменная DEPLOY_ENABLED=true и есть секреты деплоя (см. README).
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/v') ||
       github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/main')
    environment:
      name: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build_push.outputs.version }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE_REPO,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
            cd "$DEPLOY_PATH"

            echo "==> Updating repository in $DEPLOY_PATH"
            git fetch --all --prune
            branch="$(git rev-parse --abbrev-ref HEAD)"
            git pull --ff-only origin "$branch"

            if [ ! -f .env ]; then
              echo "ERROR: $DEPLOY_PATH/.env not found (copy .env.example and fill it in)." >&2
              exit 1
            fi

            echo "==> Logging in to ghcr.io"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> Pulling ${IMAGE_REPO}:${IMAGE_TAG}"
            export IMAGE_REPO IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull web

            echo "==> Restarting stack"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Waiting for the app to become healthy"
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' homework_web 2>/dev/null || echo unknown)
              echo "  health: $status"
              [ "$status" = "healthy" ] && break
              [ "$i" = "30" ] && { docker compose -f docker-compose.prod.yml logs --tail=100 web; exit 1; }
              sleep 5
            done

            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
            echo "==> Deploy finished"

      - name: Deployment summary
        run: |
          {
            echo "## Деплой выполнен"
            echo ""
            echo "- Образ: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build_push.outputs.version }}\`"
            echo "- Коммит: \`${{ github.sha }}\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
