name: CI

# CI: линтер + unit/integration тесты + сборка Docker-образов и smoke-тест стека.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check --output-format=github .

  tests:
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [unit, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests / ${{ matrix.group }}
        env:
          # Тесты используют in-memory SQLite, переменная нужна только для импорта.
          POSTGRESS_URL: postgresql+psycopg2://flask_user:flask_password@localhost:5432/postgres
        run: pytest -q tests/${{ matrix.group }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          POSTGRESS_URL: postgresql+psycopg2://flask_user:flask_password@localhost:5432/postgres
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=junit.xml -q tests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml
          retention-days: 7

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env from example
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose-test.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build images
        run: |
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose-test.yml build

      - name: Run test suite inside the test image
        run: docker compose -f docker-compose-test.yml run --rm tests pytest -q tests

      - name: Start application stack
        run: docker compose -f docker-compose.yml up -d --wait --wait-timeout 180

      - name: Smoke test HTTP endpoints
        run: |
          set -eu
          curl -fsS http://localhost/
          curl -fsS http://localhost/healthz | grep -q '"ok"'
          curl -fsS http://localhost/dashboard > /dev/null
          curl -fsS -X POST -d 'user_choice=привет' http://localhost/helloorbye | grep -q 'Привет!'

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans
