# Единая конфигурация инструментов (pytest / coverage / ruff).
# Используется и локально (`make test-local`, `make lint`), и в GitHub Actions.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.ruff]
# py313 — максимальный target, который понимают все версии ruff из requirements-dev
target-version = "py313"
line-length = 120
extend-exclude = [".venv", ".git", "__pycache__", ".idea", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["W191", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
